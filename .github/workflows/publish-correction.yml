# Goes in the DATA repository as .github/workflows/publish-correction.yml
#
# Closes the loop on a correction proposed by an outside contributor
# (apply-correction.yml opens it as a pull request from correction/<issue>).
#
# Merged: the reviewer who merged it is recorded on the notice as approved_by,
# and corrections.json - the file the site reads - is rebuilt, which is the
# moment the correction appears on the site. Closed unmerged: the issue is
# closed as declined. Either way the branch is deleted.
#
# Run by hand (workflow_dispatch), it only rebuilds corrections.json, e.g.
# after someone edited corrections/ directly.
name: publish reviewed correction

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    # Only the bot's own branches: a pull request from a fork never reaches
    # this job, and gets a read-only token anyway.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'correction/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Record the approval and rebuild corrections.json
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
        env:
          APPROVER: ${{ github.event.pull_request.merged_by.login }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          export ISSUE_NUM="${HEAD_REF#correction/}"
          git config user.name  "inscriptions-bot"
          git config user.email "actions@github.com"
          if [ -n "$PR_NUM" ]; then
            msg="publish: correction from #$ISSUE_NUM, approved by @$APPROVER in #$PR_NUM"
          else
            msg="publish: rebuild corrections.json"
          fi
          for attempt in 1 2 3 4 5; do
            python3 .github/scripts/publish_corrections.py
            git add corrections/ corrections.json
            git diff --cached --quiet && exit 0
            git commit -q -m "$msg"
            git push -q origin HEAD:"$BRANCH" && exit 0
            # A direct correction landed first: start again from it.
            sleep $((attempt * 5))
            git fetch -q origin "$BRANCH"
            git reset -q --hard FETCH_HEAD
          done
          echo "::error::main kept moving; corrections.json was not rebuilt."
          exit 1

      - name: Report on the issue and delete the branch
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const num = Number(pr.head.ref.replace('correction/', ''));
            if (num) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: num,
                name: 'awaiting-review' }).catch(() => {});
              if (pr.merged) {
                await github.rest.issues.createComment({ owner, repo, issue_number: num,
                  body: `:white_check_mark: Reviewed by @${pr.merged_by.login} and published in #${pr.number}. The machine extraction is unchanged and remains visible beside your correction.` });
              } else {
                await github.rest.issues.addLabels({ owner, repo, issue_number: num,
                  labels: ['declined'] }).catch(() => {});
                await github.rest.issues.createComment({ owner, repo, issue_number: num,
                  body: `This correction was not accepted (see #${pr.number}). Nothing was changed.` });
              }
              // A merge closes the issue through "Closes #n"; do it here too,
              // so a declined issue does not stay open.
              await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed',
                state_reason: pr.merged ? 'completed' : 'not_planned' }).catch(() => {});
            }
            await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` })
              .catch(() => {});
