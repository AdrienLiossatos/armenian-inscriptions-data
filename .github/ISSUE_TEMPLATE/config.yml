# Corrections must arrive in the machine-readable form the workflow can apply,
# so freehand issues are steered back to the interface that produces it.
blank_issues_enabled: true
contact_links:
  - name: Correct an inscription notice
    url: https://epigraphy.calfa.fr/
    about: >-
      Open the site, find the notice, press Edit, then "Send to GitHub". The
      correction is filed here as an issue, checked automatically, and
      published once an editor has reviewed it.
